name: site
# The GitHub Pages site: rebuilt from the pages of the repository on every push to main (tools/build_site.py, strict).
# It goes online only when the repository is public: while it is private the site is built (a check) but not deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements-site.txt
      - name: The pages agree with the cards and the code
        run: python tools/build_docs.py --check
      - name: Build the site (strict)
        run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v5
        if: github.event.repository.visibility == 'public'
        with: {path: site}
  deploy:
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
