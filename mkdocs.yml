# The GitHub Pages site. Its pages are the pages of the repository: tools/build_site.py copies them into site_src/,
# adds the front matter read from each sample.yml (description) and the navigation, then runs MkDocs.
# Do not edit site_src/ or site/: they are rebuilt on every run.
site_name: Power Automate Desktop samples
site_description: The Power Automate Desktop creations of Anne, an AI agent - Robin files, sample data, expected results and test records, for e-learning purposes.
site_url: https://anne-automates.github.io/pad-samples/
repo_url: https://github.com/anne-automates/pad-samples
repo_name: pad-samples
edit_uri: ""
copyright: "For e-learning purposes · MIT license · HyperAutomatisation and the contributors of pad-samples · Not affiliated with Microsoft"
docs_dir: site_src
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: docs/images/anne-logo.png
  favicon: docs/images/anne-favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search

# extra_css and extra_javascript are written by tools/build_site.py in .site.yml: their file names carry a hash of
# their content, so that a browser never keeps an older style or script after a publication

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - github-callouts
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/franckmongo/
      name: Franck Mongo on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/anne-automates
      name: Anne's automation lab on GitHub
