apps: ["Ollama (free, runs on the PC) with the model llama3.2:3b"]

prerequisites:
  - title: Install Ollama and download the model, once
    why: Every path asks a model that runs on this PC; the flow installs nothing.
    how: "Install Ollama from ollama.com. In a command prompt, run: ollama pull llama3.2:3b (about 2 GB). Ollama then serves it at http://localhost:11434/v1, the value of txt_Endpoint."
    picture: {file: assets/ollama-pull.png, caption: "The model downloaded once: the last line says success", width: 640}
files:
  - put: input/*
    into: C:\Work\SharedInbox
    note: Create the folder first. The flow creates C:\Work\SharedInbox\Triaged by itself and never changes the inbox.
  - put: model/*
    into: C:\Work\TriageModel
    note: Only for the trained classifier (Make it more accurate). The two scripts and 180 sorted emails, one folder per category.

quick_try:
  file: 3-Test.txt
  minutes: 2
  says: Four short emails (two in English, two in French) triaged in one block pasted into Main. No subflow, no input or output to create, no file.
  files: false
  apps: [Ollama with the model llama3.2:3b]
  expect:
    - "A message: 4 emails triaged in 38 s by llama3.2:3b, on this PC: no email was sent out. Then one line per email: invoice, complaint, appointment, sales_offer, with their urgency and a summary."
  picture: {file: assets/quick-try-message.png, caption: The message at the end of the quick try}
  option: "Change txt_Model in the first region to try another model you pulled (ollama pull <model>)."
flow_name: Local AI email triage

subflows:
  1-Main.txt: {does: "Example call: reads each .txt email of the inbox, calls the function, copies the email into the folder of its category and writes a CSV report."}
  2-Triage_Email.txt: {does: "The reusable part: the text of one email in, its category, urgency, summary, reply flag and 4 details out. Never stops the flow."}
  3-Test.txt: {does: "The quick try: four emails written in the block, triaged by the same action and shown in one message.", optional: true}
  4-Classify_Email_Trained.txt: {does: "The trained classifier: one email file in, its category and a confidence in percent out. Never stops the flow.", optional: true}
  5-Triage_Trained.txt: {does: "Example call of the trained classifier on the inbox: a confidence below the threshold goes to to_review.", optional: true}

variables:
  in_loc_txt_EmailText: {holds: "The text of the email: subject line, empty line, body", e.g: "Subject: Payment received, order 88213 ..."}
  in_loc_txt_Endpoint: {holds: The Ollama endpoint on this PC, e.g: 'http://localhost:11434/v1'}
  in_loc_txt_Model: {holds: "A model already pulled in Ollama", e.g: 'llama3.2:3b'}
  out_loc_bool_Ok: {holds: True when the triage worked and the category is one of the six, e.g: 'True'}
  out_loc_txt_Error: {holds: "Why it failed; empty when out_loc_bool_Ok is True", e.g: "No answer from the model llama3.2:3b at http://localhost:11434/v1. Is Ollama running, and was the model pulled?"}
  out_loc_txt_Category: {holds: "One of invoice, complaint, info_request, appointment, sales_offer, other; empty when out_loc_bool_Ok is False", e.g: complaint}
  out_loc_txt_Urgency: {holds: "low, normal or high", e.g: high}
  out_loc_txt_Summary: {holds: One sentence written by the model, e.g: No update on standing desk order SD-55102 after three weeks}
  out_loc_bool_ReplyNeeded: {holds: True when the sender expects an answer, e.g: 'True'}
  out_loc_num_ElapsedMs: {holds: Time taken by the call (the model or the classifier), e.g: '6300'}
  out_loc_num_Tokens: {holds: Tokens read and written by the model, e.g: 'about 380'}
  in_loc_txt_EmailFile: {holds: Full path of one email saved as .txt, e.g: 'C:\Work\SharedInbox\email-05.txt'}
  in_loc_txt_ModelFolder: {holds: The folder of the scripts and of triage-model.json, e.g: 'C:\Work\TriageModel'}
  in_loc_txt_PythonExe: {holds: "The Python that runs the classifier: python, py or a full path", e.g: python}
  out_loc_num_ConfidencePct: {holds: "How sure the classifier is, in whole percent", e.g: '98'}

run:
  subflow: Main
  expect:
    - "A message: 12 emails triaged in about 160 s by llama3.2:3b on this PC, 0 to review, then one line per email with its category, urgency and summary."
    - "C:\\Work\\SharedInbox\\Triaged holds one folder per category with a copy of each email, and triage-report.csv (identical decisions to expected/triage-report.csv)."
  picture: {file: assets/result.png, caption: The message at the end of the run}
  show_file: expected/triaged-tree.txt

troubleshooting:
  - when: "Every email lands in to_review with No answer from the model."
    do: "Ollama is not running or the model is missing. Open a command prompt, run ollama list: the model of txt_Model must be listed. If not, run ollama pull llama3.2:3b."
  - when: The first email takes 20 to 30 s, the next ones about 6 s.
    do: Normal. The first call loads the model in memory; Ollama keeps it loaded for 5 minutes.
  - when: "Triage_Trained sends every email to to_review: No trained model in C:\\Work\\TriageModel."
    do: Run python train_triage.py in that folder first (step 3 of Make it more accurate); it writes triage-model.json.
  - when: "The report of Triage_Trained says: The classifier failed (exit code 9009)."
    do: Windows does not find python. Set txt_PythonExe to py, or to the full path of python.exe, in the first region of Triage_Trained.
  - when: The Errors pane lists unknown variables after the paste into the function.
    do: A contract name differs from the table of the step that creates them. Fix the name in the Variables pane (capitals count); the errors disappear.
  - when: The new subflow appears under Global, not Local.
    do: The scope is easily lost while typing the name. Delete the subflow and create it again; check Local just before Save.

tested:
  - {pad: 2.72.183, date: 2026-10-01, path: Full flow, result: pass}
  - {pad: 2.72.183, date: 2026-10-01, path: Quick try, result: pass}
  - {pad: 2.72.183, date: 2026-10-01, path: Trained classifier (Triage_Trained), result: pass}
