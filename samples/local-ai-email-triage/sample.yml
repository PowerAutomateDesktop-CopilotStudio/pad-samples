# The card of this sample. tools/build_docs.py writes README.md (overview) and SETUP.md (step by step) from it and from flow/.
# Everything the code already says (subflows, contract, UI elements, line counts, settings, regions) is NOT repeated here.
# Quote any text that holds a comma inside { }.
id: local-ai-email-triage
version: 1.1.2             # x.y.z : see CONTRIBUTING, section Versions
title: Email triage by a local AI model
summary: Sort the emails of a shared inbox by category and urgency with a model that runs on the PC, each with a one-sentence summary; no email leaves the PC. Trained on your own sorted emails, it goes from 68 % to 92 % right.
category: Email
kind: component            # flow = one job end to end ; component = a reusable local function + an example call
level: intermediate        # beginner | intermediate | advanced
minutes: 20                # setup time, from zero to a successful run (the model download included)
tags: [email, ai, ollama, local-function, json, training]
techniques: [local-function, errors-as-outputs, local-llm, json-by-regex, trained-classifier]
authors: [Anne (AI agent), HyperAutomatisation]

problem: |
  A shared inbox (orders, accounts, support) must be sorted before anyone can answer: invoices to accounting, complaints
  first, sales pitches aside. Rules on keywords (*If text contains*) miss most of it: they were right for **46 %** of a test
  set of 192 emails. A cloud AI service reads better but sends every email, with its names and amounts, out of the company.

solution: |
  One *Invoke Local LLM* action asks a language model that runs **on the PC** (Ollama, free, no account, no key). The
  model returns a small JSON answer: category, urgency, summary, reply needed. Each field is read with its own regular
  expression and the category is checked against the six allowed values; anything else goes to a person. The action is
  wrapped in a **local function** (3 inputs, 8 outputs) that never stops the flow: it returns a flag and a message.
  Once a person has sorted a few dozen emails per category, an optional second function uses a **classifier trained on
  them** instead: 92 % right instead of 68 %, about 1 s per email, and a confidence that sends doubtful emails to a person.

design:
  measured: "2026-10-01, on 192 fictitious emails (96 in English, 96 in French, 6 categories, one third deliberately ambiguous), PC without GPU"
  alternatives:
    - approach: "Native: keyword rules (If text contains)"
      time: instant
      result: 46 % right. Every email that names no keyword falls into other.
      verdict: Use it for a handful of fixed senders or subjects, not for free text.
    - approach: "**Chosen: Invoke Local LLM with llama3.2:3b (2 GB), nothing to train**"
      time: 6 to 8.5 s per email
      result: "68 % right (74 % in English, 61 % in French), 79 % on the clear emails; always valid JSON, always one of the six categories. Weakest on other: internal notices are read as information requests."
      verdict: "All inside PAD, no labelled data, nothing to install but Ollama: the shortest way to a first sort, checked by a person."
    - approach: "Optional: an embedding model + a classifier trained on your sorted emails (Python)"
      time: 1.1 to 1.4 s per email
      result: "92 % right (cross-validated, 24 emails per category), with a confidence you can trust: at 80 % or more, 88 % of the emails are sorted alone and 94 % of those are right. 12 of 12 in the tested run."
      verdict: "The most accurate, once a history of sorted emails exists. It needs Python and one training run of a minute: see Make it more accurate."

improve:
  title: "Make it more accurate: train it on your own emails"
  why: |
    The language model reads every email without knowing your categories as your team uses them. A **classifier trained on
    emails a person already sorted** learns them. The training does not touch the language model: a small embedding model
    (embeddinggemma, 621 MB, also served by Ollama) turns each email into a vector of 768 numbers, and a logistic regression
    learns, in seconds on the CPU, which vectors belong to which category. It also gives a **confidence you can trust**, so
    that doubtful emails go to a person and the others are sorted alone. Measured on 2026-10-01 on the 192 test emails,
    with the same embedding model, by cross-validation (each email scored by a model that never saw it):
  table:
    head: [Sorted emails per category, Accuracy, What it takes]
    rows:
      - ["0 (the language model of this sample)", 68 %, Ollama only]
      - [2, 74 %, "Python, one training run"]
      - [4, 83 %, "Python, one training run"]
      - [8, 87 %, "Python, one training run"]
      - [16, 90 %, "Python, one training run"]
      - [24, 92 %, "Python, one training run"]
  steps:
    - "Keep the emails a person already sorted, one folder per category. The sample gives 180 fictitious ones in `model\\Sorted` (30 per category, none of them in the inbox of the sample): copy `model\\*` into `C:\\Work\\TriageModel`."
    - "Download the embedding model once: `ollama pull embeddinggemma`."
    - "In a command prompt, in `C:\\Work\\TriageModel`: `python -m venv .venv`, then `.venv\\Scripts\\activate`, then `pip install numpy scikit-learn`, then `python train_triage.py`. In about a minute it prints the cross-validated accuracy and writes `triage-model.json`."
    - "Create the optional subflows `Classify_Email_Trained` (local) and `Triage_Trained` (global) with their variables, paste them, and run `Triage_Trained` with **Run from here** on its first action. `classify_triage.py` needs Python only, no package."
    - "Below `num_ThresholdPct` (80 by default) an email goes to `to_review`. When a person files it in the right folder of `Sorted`, run `python train_triage.py` again: the classifier learns from the corrections."
  pictures:
    - {file: assets/train-console.png, caption: "The training run: 180 emails, 91.7 % cross-validated, the model written after 41 s of embedding", width: 640}
    - {file: assets/trained-result.png, caption: "Triage_Trained on the 12 sample emails: 12 of 12, each with its confidence", width: 480}

performance:
  - "Tested run of 2026-10-01: 12 emails triaged in 157 s by llama3.2:3b on a PC without GPU, 5.2 to 8.3 s per email; the first call takes 25 s while the model loads."
  - "Quick try of 2026-10-01: 4 emails in 38 s, first call included."
  - "Measured on 2026-10-01 outside PAD, with the same instructions and settings, on the 192 test emails: median 8.5 s per email, about 380 tokens per email, a valid JSON answer 192 times out of 192."
  - "Trained classifier, run of 2026-10-01: training on 180 emails in 41 s; Triage_Trained on the 12 sample emails in 77 s in the designer, 1.1 to 1.4 s per call (4.5 s for the first one), 12 of 12 right, 0 to review."

limits:
  - "Needs Ollama on the PC and one model downloaded once (llama3.2:3b is about 2 GB). The flow checks nothing about the installation: a missing model or a stopped Ollama gives the message No answer from the model."
  - "A small model makes mistakes: 68 % right on the test set of 192 emails, 49 % on the ambiguous ones, and it rarely chooses other. In the tested run, a notice of site closure went to info_request and a request for rates to sales_offer (10 of 12 right). Keep a person in the loop: the flow copies, it never deletes, moves or answers."
  - "The language model gives no reliable confidence score. What it cannot place, or places outside the six categories, goes to to_review; everything else is trusted as it is. The trained classifier gives one."
  - "Summaries are asked in English; the small model sometimes answers in the language of the email (2 of 12 in the tested run)."
  - "The sample reads emails saved as .txt files. Reading Outlook directly (Retrieve email messages) was not tested with this sample."
  - "Tested on a PC without GPU, with llama3.2:3b. Other models only change the value of txt_Model; their speed and accuracy were not tested in PAD."
  - "The trained classifier needs Python 3.10 or later; numpy and scikit-learn only for the training. Its accuracy depends on your history of sorted emails: the 92 % were measured on fictitious emails written for the sample, not on a real inbox."
  - "The trained classifier gives no urgency and no summary: only the category and its confidence. Use both functions when you need both."

