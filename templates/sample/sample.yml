# The card of this sample. tools/build_docs.py writes README.md (overview) and SETUP.md (step by step) from it and from flow/.
# Quote any text that holds a comma inside { }.
id: what-it-does-in-kebab-case         # = the folder name
version: 1.0.0                         # x.y.z, see CONTRIBUTING, section Versions
title: What it does, in a few words
summary: One sentence that says what it does and what it keeps or produces.
category: Excel                        # one of categories.yml: Excel | Files & text | PDF | Web | Desktop apps | Email
kind: flow                             # flow = one job end to end ; component = a reusable local function + an example call
level: beginner                        # beginner | intermediate | advanced
minutes: 10                            # setup time, from zero to a successful run
tags: []
techniques: []                         # ids from techniques.yml, e.g. [local-function, errors-as-outputs]
authors: [Your name]

problem: |
  Two or three lines: the business need, and why PAD alone does not cover it (or why the obvious way fails).

solution: |
  Two or three lines: the approach, the key action or technique, and the shape of the reusable part.

# keeps: "What the output keeps from the input, when it matters."

# design:                              # the approaches you compared, with measured times
#   measured: <date>, on <what>
#   alternatives:
#     - approach: Native actions only
#       time: 0.1 s
#       result: What it gives.
#       verdict: Why it was kept or rejected.

# improve:                             # optional: how to make it better (a measured gain), a section of the overview AND of the setup
#   title: Make it more accurate - train it on your own data
#   why: |
#     What it gains, measured, and what it costs.
#   table: {head: [Examples per category, Accuracy], rows: [[2, 74 %], [24, 92 %]]}
#   steps:
#     - What to do first.
#   pictures: [{file: assets/train.png, caption: "..."}]

# performance:
#   - "Measured time, with the date and the size of the input."

limits:
  - What it does not do, what it needs, what was not tested.

pictures:
  result: {file: assets/result.png, caption: "What the reader gets"}           # required
  # before: {file: assets/before.png, caption: "..."}
  # variables_pane: {file: assets/variables-pane.png, caption: "..."}
  # canvas:
  #   1-Main.txt: {file: assets/canvas.png, caption: "Main after the paste"}
  # actions:                          # the dialog of a key action, shown under the canvas of its subflow
  #   2-My_Function.txt:
  #     - {file: assets/action.png, caption: "What the paste set in the action", width: 420}

apps: []                               # e.g. [Microsoft Excel (desktop)]

# prerequisites:                       # what must be on the PC before ANY path works, shown first in each path
#   - title: Install the app, once
#     why: The flow calls it; it installs nothing.
#     how: "Where to get it, the command to run."
#     picture: {file: assets/install.png, caption: "...", width: 640}

files:
  - put: input/example.xlsx
    into: C:\Work\Example
    note: Create the folder first.

# quick_try:                           # required for a component: one block for Main that asks nothing
#   file: 3-Test.txt
#   minutes: 2
#   says: The whole job in one block pasted into Main. No subflow, no input or output to create.
#   apps: [Microsoft Excel (desktop)]  # as few as possible
#   files: false                       # the block needs none of the files of files: (default true)
#   expect:
#     - What the reader sees at the end.
#   option: "An optional setting of its first region, and what it needs."

flow_name: The name the reader gives the flow in PAD

subflows:                              # one line per file of flow/
  1-Main.txt: {does: "The whole job, top to bottom."}   # quote any text that holds a comma

variables:                             # every input and output: what it holds and a real example
  # in_loc_txt_Path: {holds: Full path of the file, e.g: 'C:\Work\Example\example.xlsx'}
  # in_glob_txt_Folder: {holds: ..., e.g: ..., default: 'C:\Work\Example'}

# manual_steps:
#   - title: Mark the password variable as sensitive
#     why: The paste cannot carry this setting.
#     how: In the Variables pane, right-click txt_Password, select Mark as sensitive.

run:
  subflow: Main
  expect:
    - What the reader sees at the end.
  # show_file: expected/result.txt

troubleshooting:
  - when: What the reader sees
    do: What to do

tested:
  - {pad: 2.72.183, date: 2026-01-31, result: pass}
